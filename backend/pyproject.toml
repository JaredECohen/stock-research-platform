[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphacouncil-backend"
version = "0.1.0"
description = "AlphaCouncil: Multi-agent equity research backend"
requires-python = ">=3.11"

# This list is the ONLY place a dependency is declared. requirements.txt is
# generated from it (`make lock`) and is what Docker, CI and the README
# install; edit here, re-lock, commit both.
#
# Pins are floors, not ceilings, on most packages so the OpenAI Agents SDK
# ecosystem (which moves quickly) stays installable without manual
# unpinning. Hard caps are reserved for packages where a major-version bump
# would break our test surface. The lock turns every floor into an exact
# pin, so a floor bump here is what moves production.
dependencies = [
    # --- Web framework -----------------------------------------------------
    # FastAPI 0.118+ allows starlette 1.x, which is required by the
    # openai-agents / mcp / sse-starlette transitive chain.
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.30.6",

    # --- Data + persistence ------------------------------------------------
    "pydantic>=2.12.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    # numpy backs the factor regression (services/factor_analytics.py) and
    # the batched cosine scoring in services/vector_store.py. Imported
    # lazily in the vector path — it costs ~28MB RSS, which is worth paying
    # only once a process actually runs a streaming search.
    "numpy>=1.26.4",
    # `pandas` was removed 2026-08-12: nothing in the repo imported it, and
    # it is not a hard requirement of any dependency (only of the optional
    # `openai[datalib]` extra, which we don't install). It was ~48MB of
    # image weight for zero call sites. If a future analytics module wants
    # it, add it back with the import kept lazy so it stays off the idle
    # footprint.

    # --- LLM SDKs ----------------------------------------------------------
    # openai 2.26+ is required by openai-agents.
    "openai>=2.26.0",
    # anthropic >=0.40 needed for httpx 0.28+ compatibility (the 0.39
    # client init passed a `proxies` kwarg that httpx 0.28 dropped, which
    # silently nuked every Anthropic-routed agent call).
    "anthropic>=0.42,<1",
    # google-genai is optional — without it the Gemini branch in
    # agents/llm.py disables itself gracefully and demo mode remains fully
    # functional.
    "google-genai>=0.7.0; python_version >= '3.10'",

    # OpenAI Agents SDK — official multi-agent runtime (Phase 3 production
    # path). When OPENAI_API_KEY is set + USE_AGENTS_SDK=true,
    # sdk_runtime.py uses this to drive real LLM handoffs / tool calls.
    # Otherwise the in-process shim defined in the same file handles the
    # topology deterministically.
    "openai-agents>=0.14.6",

    # --- Misc --------------------------------------------------------------
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
    # pytest ships in the production image today; it stays in the main list
    # for this cut so the image contents do not change. Moving it to an
    # optional `dev` extra is a separate, deploy-visible decision.
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    # APScheduler powers the Phase 5 monitoring loops in production.
    # Dev/test run with ENABLE_MONITORING=false so this dependency is not
    # exercised unless the runtime explicitly opts in.
    "apscheduler>=3.10.4",

    # Per-IP rate limiting on the expensive endpoints (memo / chat /
    # analyze). Default backend is in-memory, which is fine for a
    # single-replica deploy. Set `RATE_LIMIT_STORAGE_URL=redis://...` to
    # share state across replicas.
    "slowapi>=0.1.9",

    # Vector store for filing / transcript chunk retrieval. pgvector is the
    # Postgres extension; the python package wraps it for SQLAlchemy. The
    # `EmbeddingChunk` model uses pgvector's `Vector` column type when
    # Postgres is the backend, falling back to JSON storage on SQLite for
    # local dev parity.
    "pgvector>=0.3.0",
    # tiktoken powers token-aware chunking of long filings / transcripts so
    # embed calls stay within OpenAI's 8K-token input limit per chunk.
    "tiktoken>=0.7.0",

    # --- Customer auth (FEAT-002) --------------------------------------------
    # Verifies Clerk session JWTs (RS256) against the tenant's JWKS in
    # `app/auth/jwks.py`. The `crypto` extra is `cryptography`, which the
    # RSA verification needs; both were already in the lock transitively
    # (via `mcp`), so declaring them here pins the floor we actually rely
    # on rather than inheriting whatever another package happens to want.
    # Imported lazily inside the auth middleware so `import app.main` cost
    # stays flat (see test_dependency_footprint.py).
    "PyJWT[crypto]>=2.9",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# ruff — `ruff check app` from backend/ is a blocking CI step.
#
# The target is the `requires-python` floor, not the Docker image's 3.12:
# ruff's UP rules would otherwise happily rewrite syntax that the 3.11
# floor cannot parse, and that class of bug has shipped before (a 3.12-only
# construct passed the 3.13 CI and failed on the image). The py311-floor
# CI job is the second line of defence for the same thing.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["app/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
ignore = [
    # --- permanent for this phase -------------------------------------------
    "E501",     # 778 long lines; no reformat pass is scheduled
    "DTZ001",   # naive UTC is the persisted convention: DateTime columns are
    "DTZ003",   # naive, sqlite comparisons are naive, and the monitoring
    "DTZ011",   # loops compare against `datetime.utcnow()`. Making these
    "DTZ012",   # aware is a behavior change, not a lint fix.
    "B905",     # zip(strict=) raises on unequal lengths: a behavior change
    "B008",     # FastAPI `Query()` / `Depends()` call-in-default is the idiom
    # --- residue that a fix would not improve ------------------------------
    "UP038",    # `isinstance(x, (A, B))` -> `isinstance(x, A | B)`: the rule is
                # deprecated upstream (ruff 0.12 warns when it is named), the
                # tuple form is the faster one, and 19 rewrites for no gain
                # are not worth reviewing. Drop the ignore if ruff removes it.
    # --- temporary, owned by other slices ------------------------------------
    "B039",     # mutable ContextVar default in agents/llm.py (Phase 2 owns llm.py)
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export names on purpose.
"app/__init__.py" = ["F401"]
"app/schemas/__init__.py" = ["F401"]
"app/models/__init__.py" = ["F401"]
# monitoring/__init__ configures logging before importing the loops, so the
# imports are deliberately not at the top.
"app/monitoring/__init__.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy — scoped to the pure-arithmetic paths where a wrong type is a wrong
# number. Runs in CI as a non-blocking step (its error count is echoed) until
# the scoped set reaches zero; then it becomes blocking and `files` grows.
#
# `files` must list only paths that exist: mypy errors on a missing entry.
# ---------------------------------------------------------------------------
# mypy targets the image's 3.12, NOT the 3.11 package floor. numpy's stubs
# use PEP 695 `type` statements, which mypy rejects under 3.11 as a *fatal*
# syntax error — "errors prevented further checking" — so the scoped run
# checked zero files while reporting a tidy "1 error". The floor itself is
# guarded where it belongs and blockingly: the py311-floor job byte-compiles
# backend/app on 3.11, and ruff's target-version keeps UP off 3.12-only
# rewrites. Neither of those depends on this line.
[tool.mypy]
python_version = "3.12"
files = [
    "app/finance",
    "app/agents/graph.py",
    "app/agents/safe_runner.py",
    "app/agents/roster.py",
    "app/agents/memo_context.py",
]
follow_imports = "silent"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
check_untyped_defs = false
