databases:
  - name: marketmosaic-db
    plan: basic-256mb
    databaseName: marketmosaic
    user: marketmosaic
    postgresMajorVersion: "16"

services:
  - type: web
    name: marketmosaic
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Bumped from `starter` (0.5 CPU, 512MB RAM, $7/mo) to `standard`
    # (1 CPU, 2GB RAM, $25/mo). Memo regen on the expanded SP500-ish
    # universe routinely OOM-killed the worker mid-task: 26+ LLM calls,
    # full filing-body cache (~250KB × 10 filings/ticker), and
    # vector_store loading all chunk embeddings (1536 floats each)
    # into Python for cosine similarity, plus the universe seed in
    # memory, blew past 512MB. SIGKILL bypasses Python, so failures
    # were invisible: in-memory _REGEN_JOBS / _REGEN_FAILURES vanished
    # with the process, no exception ever fired through the try/except
    # in _run_regen_job. 4× the RAM resolves it.
    #
    # 2026-08-12: OOM-killed again, on `standard` this time. Root cause
    # was NOT undersizing — `vector_store.search` treated a falsy ticker
    # as "no filter" and scanned the entire `doc_chunks` corpus (every
    # embedding rehydrated as 1536 boxed Python floats, ~48KB each), which
    # no instance size survives. Fixes, in order of effect:
    #   - the missing-ticker global scan is now refused outright;
    #   - ranking moved into Postgres via pgvector (top_k rows, not all);
    #   - the fallback path streams + scores in numpy with a top-k heap;
    #   - regen + monitoring moved off this service (see the worker below),
    #     so the web instance no longer has to be sized for their peak.
    # 2026-08-14: measured, so this is no longer a guess. Render metrics
    # put this service at avg 226MB / peak 334MB even after regen and
    # monitoring moved to the worker. Against `starter`'s 512MB cap that is
    # 1.5x headroom on the traffic-exposed, latency-sensitive service —
    # not enough, so it stays `standard`. (An earlier note here assumed
    # web could shrink once the worker split landed; the numbers say
    # otherwise. The worker is the one that downsized — see below.)
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    domains:
      - marketmosaic.ai
      - www.marketmosaic.ai
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketmosaic-db
          property: connectionString

      - key: APP_ENV
        value: production
      - key: USE_DEMO_DATA
        value: "false"
      # Explicit live-data intent. USE_DEMO_DATA=false already routes the
      # provider chain to live sources; setting this too keeps every
      # consumer of the flag pair (incl. memo `generation_mode` labeling)
      # unambiguous.
      - key: ENABLE_LIVE_DATA
        value: "true"
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: "8000"
      - key: PORT
        value: "8000"
      - key: FRONTEND_URL
        value: https://marketmosaic.ai
      - key: CORS_ORIGINS
        value: https://marketmosaic.ai,https://www.marketmosaic.ai

      # Production-mode toggles (Wave 9b).
      # Nightly cron jobs (history backfill 03:15 UTC, EDGAR poller,
      # outcome tracking, LLM-log GC) and the memo-regen queue drainer
      # both now run on the `marketmosaic-worker` service below, NOT here.
      # 2026-08-12: they used to run in this process, which meant the web
      # instance had to be sized for a nightly universe sweep plus a
      # concurrent memo regen, and an OOM in either took user-facing
      # traffic down with it. The web service still *enqueues* regen jobs
      # via POST /analyze — the queue is durable and DB-backed, so the two
      # services coordinate entirely through Postgres.
      # Both must stay "false" here; flipping either back on re-couples
      # the memory profiles.
      - key: ENABLE_MONITORING
        value: "false"
      - key: ENABLE_REGEN_WORKER
        value: "false"
      # glibc opens up to 8 arenas per core and each keeps its own
      # high-water mark, so a transient spike in one thread permanently
      # inflates RSS — which is what Render bills and kills on. This
      # process is thread-heavy (uvicorn + the regen worker + a 10-thread
      # APScheduler pool), so capping arenas trades a little allocator
      # contention for a materially flatter memory curve. Also set as the
      # image default in the Dockerfile; repeated here so it survives
      # anyone running the image with an overridden env.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Per-IP rate limits on /api/chat, /api/stocks/*/memo,
      # /api/stocks/*/analyze, /api/screener/custom, /api/seed-universe,
      # /api/admin/run-backfill. In-memory store is fine for one
      # replica; set RATE_LIMIT_STORAGE_URL=redis://… when scaling out.
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Long-term agent memory writes to memory/companies/<TICKER>.md.
      # Render's container disk is ephemeral — disable by default to
      # avoid silently losing entries on every redeploy. Set "true"
      # only after mounting a persistent disk for memory/.
      - key: ENABLE_LONG_TERM_MEMORY
        value: "false"

      # Bearer token for the /api/admin/* ops surface (and
      # /api/seed-universe, which sits outside that prefix). MUST be set
      # in the Render dashboard BEFORE this deploys: `admin_auth` fails
      # CLOSED in production, so an unset token makes those endpoints
      # return 503 rather than serving them openly. Endpoints the browser
      # calls (ui-log POST, track-record, dcf-versions,
      # lopsidedness-audit, evaluate-outcomes) are exempt and keep
      # working without it — see app/api/admin_auth.EXEMPT_PREFIXES.
      - key: ADMIN_API_TOKEN
        sync: false
      # Secrets — set values in the Render dashboard, not in this file.
      - key: SEC_USER_AGENT
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: TIINGO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ---------------------------------------------------------------------
  # Background worker — owns memo regen + the monitoring loops.
  # ---------------------------------------------------------------------
  # Same Docker image as the web service, different entrypoint
  # (`python -m app.worker` instead of uvicorn). Split out on 2026-08-12
  # so the two very different memory profiles stop sharing a ceiling:
  #   - web: a few MB per request, flat and predictable.
  #   - worker: memo regen is the largest allocator in the codebase, and
  #     the nightly sweeps walk the whole S&P 500 universe with several
  #     jobs overlapping between 03:00 and 06:00 UTC.
  # `starter` (512MB), downsized from `standard` on 2026-08-14 against
  # measured data rather than the earlier guess. Render metrics over a
  # window that included a full memo regen:
  #
  #   worker: avg 118MB, peak 133MB   (was provisioned 2048MB — 6.5% used)
  #   web:    avg 226MB, peak 334MB
  #
  # A memo regen now adds only ~18MB over the idle baseline (`rss
  # memo_end: 148.3 MB` against ~133MB idle) because the unbounded
  # `doc_chunks` scan that caused the original OOM is gone. 133MB against
  # a 512MB cap is 3.8x headroom.
  #
  # Residual risk, stated plainly: a nightly universe sweep (03:00-06:00
  # UTC) has NOT been measured on this service — the loops only moved here
  # mid-morning, after that day's crons had already fired. It is a
  # sequential per-ticker walk with per-ticker peaks freed each iteration,
  # so it should behave like the regen, but that is inference not data.
  # The failure mode is bounded and now observable: an OOM restarts the
  # worker, `recover_orphans` requeues the in-flight job once with
  # checkpoint resume, and the missed loop shows up as a stale entry in
  # `/api/admin/cron-health`. Revert this line to `standard` if it fires.
  #
  # NOTE the web service stays `standard`: 334MB peak against a 512MB cap
  # is only 1.5x headroom on the traffic-exposed, latency-sensitive
  # service, which is not enough.
  #
  # MUST stay at a single instance: `claim_next_job` is safe for
  # concurrent claims, but the APScheduler loops are not multi-instance
  # aware and a second replica would double provider spend.
  - type: worker
    name: marketmosaic-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The `app` package is NOT importable from the image's default
    # working directory: WORKDIR is /app but `COPY backend /app/backend`
    # puts the package at /app/backend/app. Bare `python -m app.worker`
    # exits 1 with "No module named 'app'" — which is how this first
    # shipped on 2026-08-14, because it was only ever run from the
    # backend/ directory locally. The web service dodges it because its
    # generated /app/server.py does sys.path.insert(0, "/app/backend").
    #
    # Fixed with PYTHONPATH (see envVars) rather than a
    # `sh -c "cd /app/backend && exec ..."` wrapper, for two reasons:
    #   - python stays PID 1, so Render's SIGTERM reaches it directly and
    #     the graceful shutdown in app/worker.py actually runs. A shell
    #     wrapper without `exec` would absorb the signal and the worker
    #     would be SIGKILLed on every deploy.
    #   - the working directory stays /app, matching the web service.
    #     `memory_dir` defaults to a cwd-relative "./memory", so cd-ing
    #     elsewhere would silently point the two services at different
    #     directories.
    dockerCommand: python -m app.worker
    plan: starter
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketmosaic-db
          property: connectionString

      # Puts the `app` package on sys.path without changing the working
      # directory — see the dockerCommand comment above.
      - key: PYTHONPATH
        value: /app/backend

      - key: APP_ENV
        value: production
      - key: USE_DEMO_DATA
        value: "false"
      - key: ENABLE_LIVE_DATA
        value: "true"

      # The inverse of the web service: this process exists to run these.
      - key: ENABLE_MONITORING
        value: "true"
      - key: ENABLE_REGEN_WORKER
        value: "true"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # No HTTP surface here, so per-IP rate limiting is meaningless.
      - key: RATE_LIMIT_ENABLED
        value: "false"
      # Same ephemeral-disk caveat as the web service.
      - key: ENABLE_LONG_TERM_MEMORY
        value: "false"

      # Secrets — set values in the Render dashboard, not in this file.
      # The worker needs the full set: the monitoring loops hit every
      # provider and memo regen makes the LLM calls.
      - key: SEC_USER_AGENT
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: TIINGO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
